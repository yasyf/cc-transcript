# Great Docs configuration — https://posit-dev.github.io/great-docs/
# Build: uv run great-docs build · Preview: uv run great-docs preview

module: cc_transcript
display_name: cc-transcript
parser: google
dynamic: true
repo: https://github.com/yasyf/cc-transcript
site_url: "https://yasyf.github.io/cc-transcript/"
pypi: true
github_style: widget
jupyter: python3

# Conservative defaults: a solid navbar and a single accent, no gradient
# presets or hero starfield. The gradient/starfield extras read as busy and the
# starfield canvas intercepts homepage clicks; keep them off unless asked.
# TODO(bootstrap): pick a navbar color and accent that fit the project.
navbar_color: "#1e293b"
accent_color: "#3b82f6"
dark_mode_toggle: true
back_to_top: true
keyboard_nav: true

hero:
  name: cc-transcript
  tagline: "The cc-family session-activity platform: non-lossy typed events with a Rust fast path, lifted into turns, tool calls, and edits — durable context windows, feedback mining and judging, and a transcript-investigation CLI on one spine."

# Narrative doc sections live alongside the curated API reference: Getting Started
# is a single landing page (docs/getting-started/index.qmd); Guides is a numbered
# set under docs/guide. Both render executable Quarto cells at build time.
sections:
  - title: Getting Started
    dir: docs/getting-started
    index: true
  - title: Guides
    dir: docs/guide
    navbar_after: Getting Started
    index: true

# Generated Click CLI reference (uvx cc-transcript: list/show/grep/stats/slice/digest).
cli:
  enabled: true
  module: cc_transcript.cli
  name: cli

authors:
  - name: Yasyf Mohamedali
    role: Maintainer
    github: yasyf
    email: yasyfm@gmail.com

