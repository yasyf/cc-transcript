# Great Docs configuration — https://posit-dev.github.io/great-docs/
# Build: uv run great-docs build · Preview: uv run great-docs preview

module: cc_transcript
display_name: cc-transcript
parser: google
dynamic: true
repo: https://github.com/yasyf/cc-transcript
site_url: "https://yasyf.github.io/cc-transcript/"
pypi: true
github_style: widget
jupyter: python3

navbar_style: lilac
content_style: lilac
# TODO(bootstrap): pick accent colors that fit the project
accent_color:
  light: "#ffb300"
  dark: "#ffca28"
dark_mode_toggle: true
back_to_top: true
keyboard_nav: true

hero:
  name: cc-transcript
  tagline: "Typed events for Claude Code transcripts: discovery, a superset JSONL parser (Python + Rust), and ingestion-state tracking."
  starfield: true

# Narrative doc sections are optional — dynamic mode generates the API reference
# from docstrings without them. Uncomment and point at docs/ dirs as they appear.
# sections:
#   - title: Getting Started
#     dir: docs/getting-started
#     index: true
#   - title: Guide
#     dir: docs/guide
#     navbar_after: Getting Started
#     index: true

cli:
  enabled: true
  module: cc_transcript.cli
  name: cli

authors:
  - name: Yasyf Mohamedali
    role: Maintainer
    github: yasyf
    email: yasyfm@gmail.com

# Curated symbol reference (public API only). Optional — without it, dynamic
# mode documents everything in cc_transcript.__all__.
