[package]
name = "cc_transcript_parser"
version = "0.9.0"
edition = "2021"
# include_str! reaches into cc_transcript/ two levels up; the crate only builds in-repo.
publish = false

[lib]
name = "_parser_rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = [
    "dep:pyo3",
    "dep:pyo3-build-config",
    "dep:rayon",
    "dep:crossbeam-channel",
    "dep:num_cpus",
    "dep:tree-sitter",
    "dep:tree-sitter-bash",
    "dep:udpipe-rs",
]
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.28", features = ["abi3-py313", "chrono"], optional = true }
# arbitrary_precision keeps each number's raw text so json_to_py (event.rs) can
# mirror Python json semantics for numbers sonic-rs stores lossily as f64.
sonic-rs = { version = "0.5", features = ["arbitrary_precision"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
rayon = { version = "1.10", optional = true }
crossbeam-channel = { version = "0.5", optional = true }
num_cpus = { version = "1", optional = true }
memchr = "2.7"
once_cell = "1"
regex = "1"
# Grammar-pinned to the Python wheel: tree_sitter_bash 0.25.1 both sides (same
# bash grammar), tree-sitter core 0.26 matches the wheel's tree-sitter 0.26.0.
tree-sitter = { version = "0.26", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
# UDPipe C++ FFI engine backing the NLP substrate (nlp.rs). python-gated so the
# Swift xcframework build (--no-default-features) never links libudpipe or embeds
# the model. The dead ureq/rustls/ring transitive deps are accepted (no fork).
udpipe-rs = { version = "0.2", optional = true }

[build-dependencies]
pyo3-build-config = { version = "0.28", features = ["resolve-config"], optional = true }

[dev-dependencies]
# Criterion for the v14 P0 parse/filter/activity baseline (rust/benches/parse.rs).
# default-features off: skip the plotters/HTML report machinery; estimates.json
# (the medians BASELINE.json reads) is written by the core regardless.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "parse"
harness = false
