[package]
name = "cc_transcript_parser"
version = "0.9.0"
edition = "2021"

[lib]
name = "_parser_rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = [
    "dep:pyo3",
    "dep:pyo3-build-config",
    "dep:rayon",
    "dep:crossbeam-channel",
    "dep:num_cpus",
    "dep:udpipe-rs",
    "dep:dirs",
    "dep:tree-sitter",
    "dep:tree-sitter-bash",
]
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.28", features = ["abi3-py313", "chrono"], optional = true }
# arbitrary_precision keeps each number's raw text so json_to_py (event.rs) can
# mirror Python json semantics for numbers sonic-rs stores lossily as f64.
sonic-rs = { version = "0.5", features = ["arbitrary_precision"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
rayon = { version = "1.10", optional = true }
crossbeam-channel = { version = "0.5", optional = true }
num_cpus = { version = "1", optional = true }
memchr = "2.7"
once_cell = "1"
regex = "1"
udpipe-rs = { version = "0.2", optional = true }
dirs = { version = "5", optional = true }
# Grammar-pinned to the Python wheel: tree_sitter_bash 0.25.1 both sides (same
# bash grammar), tree-sitter core 0.26 matches the wheel's tree-sitter 0.26.0.
tree-sitter = { version = "0.26", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }

[build-dependencies]
pyo3-build-config = { version = "0.28", features = ["resolve-config"], optional = true }
