[package]
name = "cc_transcript_parser"
version = "0.8.0"
edition = "2021"

[lib]
name = "_parser_rs"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.28", features = ["abi3-py313", "chrono"] }
serde = { version = "1", features = ["derive"] }
sonic-rs = "0.5"
chrono = { version = "0.4", default-features = false, features = ["std"] }
rayon = "1.10"
crossbeam-channel = "0.5"
num_cpus = "1"
memchr = "2.7"
once_cell = "1"
regex = "1"
udpipe-rs = "0.2"
dirs = "5"
# Grammar-pinned to the Python wheel: tree_sitter_bash 0.25.1 both sides (same
# bash grammar), tree-sitter core 0.26 matches the wheel's tree-sitter 0.26.0.
tree-sitter = "0.26"
tree-sitter-bash = "0.25"
