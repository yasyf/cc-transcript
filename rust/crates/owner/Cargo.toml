[package]
name = "cc-transcript-owner"
version = "0.9.0"
edition = "2021"
# include_str! reaches into cc_transcript/ four levels up; the crate only builds in-repo.
publish = false

[[bin]]
name = "cc-transcript-owner"
path = "src/main.rs"

[dependencies]
cc-transcript-core = { path = "../core" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
crossbeam-channel = "0.5"
jsonschema = { version = "0.56", default-features = false }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
sonic-rs = { version = "0.5", features = ["arbitrary_precision"] }

[dev-dependencies]
libc = "0.2"
tempfile = "3"
