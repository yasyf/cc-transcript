[package]
name = "cc-transcript-core"
version = "0.9.0"
edition = "2021"
publish = false

[dependencies]
# arbitrary_precision keeps each number's raw text so json_to_py (the py crate's
# event.rs) can mirror Python json semantics for numbers sonic-rs stores lossily
# as f64.
sonic-rs = { version = "0.5", features = ["arbitrary_precision"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
memchr = "2.7"
once_cell = "1"
regex = "1"
# Gated behind `command`; grammar-locked to the Python wheel (tree_sitter_bash 0.25.1
# both sides, tree-sitter core 0.26 matching the wheel's 0.26.0). The Swift/CI build
# takes core with default-features off, so this stays out of the python-free path.
tree-sitter = { version = "0.26", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
# ids.rs computes the cross-language tool-content digest; default features only
# (no `asm`), so the python-free core stays pure-Rust for the Swift consumer.
sha2 = "0.10"
# ECMAScript-exact Number::toString for canonical JSON: Rust std and plain ryu pick
# a different last digit than Python/ES on shortest ties (e.g. 698957826421429.2).
ryu-js = "1.0"

[features]
default = ["command"]
command = ["dep:tree-sitter", "dep:tree-sitter-bash"]

[dev-dependencies]
# Criterion for the v14 P0 parse/filter/activity baseline (benches/parse.rs).
# default-features off: skip the plotters/HTML report machinery; estimates.json
# (the medians BASELINE.json reads) is written by the core regardless.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "toolcall"
harness = false
