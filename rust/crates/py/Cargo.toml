[package]
name = "cc-transcript-py"
version = "0.9.0"
edition = "2021"
# include_str! reaches into cc_transcript/ four levels up; the crate only builds in-repo.
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
cc-transcript-core = { path = "../core" }
pyo3 = { version = "0.28", features = ["abi3-py313", "chrono", "multiple-pymethods"] }
pyo3-stub-gen = "0.23"
# arbitrary_precision keeps each number's raw text so json_to_py (event.rs) can
# mirror Python json semantics for numbers sonic-rs stores lossily as f64.
sonic-rs = { version = "0.5", features = ["arbitrary_precision"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
rayon = "1.10"
crossbeam-channel = "0.5"
num_cpus = "1"
once_cell = "1"
regex = "1"
# UDPipe C++ FFI engine backing the NLP substrate (nlp.rs). Lives in this crate
# so the Swift consumer's python-free cc-transcript-core build never links
# libudpipe or embeds the model. The dead ureq/rustls/ring transitive deps are
# accepted (no fork).
udpipe-rs = "0.2"

[build-dependencies]
pyo3-build-config = { version = "0.28", features = ["resolve-config"] }
