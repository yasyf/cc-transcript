[package]
name = "cc-transcript-cli"
version = "0.9.0"
edition = "2021"
publish = false

[[bin]]
name = "cc-transcript"
path = "src/main.rs"

[dependencies]
cc-transcript-core = { path = "../core", features = ["command", "sqlite"] }
clap = { version = "4.5", features = ["derive", "env", "string"] }
sonic-rs = { version = "0.5", features = ["arbitrary_precision"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
regex = "1"
rayon = "1.10"
ctrlc = "3.4"
libc = "0.2"
once_cell = "1"

[dev-dependencies]
tempfile = "3"
