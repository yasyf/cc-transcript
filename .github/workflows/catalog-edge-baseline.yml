name: Catalog retained edge ordering baseline
on:
  push:
    branches: [test/catalog-edge-frontier-before]
permissions:
  contents: read
jobs:
  retained-edge-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Record exact source and toolchain
        run: git rev-parse HEAD && rustc -Vv && uname -m
      - name: Grade real earlier-winner contract on unchanged production
        run: cargo test -p cc-transcript-core --no-default-features --lib snapshot::tests::registered_catalog_retained_directory_edge_preserves_earlier_frontier_winner -- --exact --nocapture --test-threads=1
