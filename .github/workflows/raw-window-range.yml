name: Raw Source Capability Contract
on:
  push:
    branches: [perf/generation-owned-interactions]
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p cc-transcript-core --no-default-features --lib -- raw_source_capability --nocapture
