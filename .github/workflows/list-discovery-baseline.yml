name: Private list discovery baseline

on:
  push:
    branches: [diag/list-discovery-baseline-c810]

permissions:
  contents: read

concurrency:
  group: list-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Characterize the official native list on private roots
        run: python -I -B scripts/list_discovery_baseline_ci.py "$RUNNER_TEMP/c810-list-baseline"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: private-list-baseline-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/c810-list-baseline/receipts
            ${{ runner.temp }}/c810-list-baseline/results
            ${{ runner.temp }}/c810-list-baseline/bootstrap_result.json
