name: Release (PyPI)

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-pypi
  cancel-in-progress: false

jobs:
  build_wheels:
    name: Build ${{ matrix.id }} wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm64
            os: macos-14
            cibw_archs: arm64
          - id: macos-x86_64
            os: macos-15-intel
            cibw_archs: x86_64
          - id: linux-x86_64
            os: ubuntu-latest
            cibw_archs: x86_64
          - id: linux-aarch64
            os: ubuntu-24.04-arm
            cibw_archs: aarch64
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.13"
          cache-dependency-glob: uv.lock

      - name: Set version from tag
        shell: bash
        run: uv version --frozen "${GITHUB_REF_NAME#v}"

      - name: Install Rust (non-Linux hosts)
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts (host builds)
        if: runner.os != 'Linux'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: true
          shared-key: wheels-${{ matrix.id }}

      - name: Build wheels
        uses: pypa/cibuildwheel@v3
        with:
          output-dir: wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.cibw_archs }}

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.id }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.13"
          cache-dependency-glob: uv.lock

      - name: Set version from tag
        run: uv version --frozen "${GITHUB_REF_NAME#v}"

      - name: Build sdist
        run: uv build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          --title "${GITHUB_REF_NAME}"
          --generate-notes
          --latest
          --repo "${{ github.repository }}"
          dist/*
