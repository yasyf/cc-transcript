name: Public112 physical UID key oracle
on:
  push:
    branches: [diag/public112-key-oracle-component]
permissions:
  contents: read
jobs:
  exact-physical-key-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: a45f1d86db3fb627806625bfd75501790f4c0071
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Exact physical key capacity and authority separation
        run: |
          cargo test -p cc-transcript-core --no-default-features --lib -- snapshot::tests::registered_catalog_key_admits_escaped_capacity_before_encoding --exact --nocapture
          cargo test -p cc-transcript-core --no-default-features --lib -- snapshot::tests::registered_catalog_uid_shared_physical_cache_never_reuses_a_broader_context_grant --exact --nocapture
