name: Catalog pending NAME corrected proof

on:
  pull_request:

permissions:
  contents: read

jobs:
  catalog-name-linux:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Record actual Rust toolchain
        run: |
          rustc --version --verbose
          cargo --version
      - name: Grade corrected retained NAME and registered catalog invariants
        run: cargo test -p cc-transcript-core --no-default-features --lib -- registered_catalog_ --nocapture
