name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}-v2
  cancel-in-progress: true

jobs:
  common-borrowed-parent-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test registered catalog physical provenance
        run: cargo test -p cc-transcript-core --no-default-features --lib -- registered_catalog_borrowed_parent_proof_ --nocapture
