name: Restricted symlink warm diagnostic

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: restricted-symlink-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restricted-symlink-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run exact allowed restricted symlink warm case
        run: cargo test -p cc-transcript-core --no-default-features --lib -- public_catalog_restricted_symlink_unchanged_negative_reuses_names --nocapture
