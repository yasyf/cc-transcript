name: Public112 repaired catalog and admission regressions
on:
  push:
    branches: [diag/public112-repair-union-component]
permissions:
  contents: read
jobs:
  repaired-catalog-and-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 4bfbe381ee361ea4d31dd7cc958aa0a131f33748
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Catalog authority, observations, and reuse
        id: catalog
        continue-on-error: true
        run: cargo test -p cc-transcript-core --no-default-features --lib -- catalog_ --nocapture
      - name: Location admission and conservation
        id: location
        continue-on-error: true
        run: cargo test -p cc-transcript-core --no-default-features --lib -- location_ --nocapture
      - uses: actions/checkout@v7
        with:
          ref: e8760d2d68a5a3e11025ca0536dfc952104c96ee
      - name: Establish original catalog-key and earlier-winner regressions
        continue-on-error: true
        run: cargo test -p cc-transcript-core --no-default-features --lib -- registered_catalog_ --nocapture
      - name: Establish original page-parent proof regressions
        continue-on-error: true
        run: cargo test -p cc-transcript-core --no-default-features --lib -- location_parent_hint --nocapture
      - name: Establish original regular-parent canonicalization regression
        continue-on-error: true
        run: cargo test -p cc-transcript-core --no-default-features --lib -- location_nonmatching_regular_files_share_parent_canonicalization --nocapture
      - name: Require both regression populations
        if: always()
        env:
          CATALOG: ${{ steps.catalog.outcome }}
          LOCATION: ${{ steps.location.outcome }}
        run: test "$CATALOG" = success && test "$LOCATION" = success
