name: Targeted unpublished load charge proof

on:
  pull_request:

permissions:
  contents: read

jobs:
  load-charge-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test actual incremental load accounting and independent allocation audits
        run: cargo test -p cc-transcript-core --no-default-features --lib -- load_charge_ --nocapture
