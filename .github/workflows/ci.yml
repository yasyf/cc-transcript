name: Admission report baseline

on: pull_request

jobs:
  admission-report-baseline:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Measure existing admission report construction
        run: cargo test -p cc-transcript-core --no-default-features --lib -- admission_report_ --nocapture
