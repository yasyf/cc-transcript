name: Public alias descriptor diagnostic
on:
  push:
    branches: [diag/public112-alias-descriptor-trace]
permissions:
  contents: read
jobs:
  alias-descriptor-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: e8760d2d68a5a3e11025ca0536dfc952104c96ee
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify syscall tracer and compile unchanged test only
        run: |
          strace --version
          cargo test -p cc-transcript-core --no-default-features --lib --no-run --message-format=json > build.jsonl
      - name: Trace the single unchanged alias regression
        run: |
          python3 - <<'PYTRACE'
          import hashlib,json,pathlib,subprocess
          rows=[json.loads(line) for line in pathlib.Path("build.jsonl").read_text().splitlines() if line.startswith("{")]
          exes={r["executable"] for r in rows if r.get("reason")=="compiler-artifact" and r.get("executable") and r.get("target",{}).get("name")=="cc_transcript_core" and r.get("profile",{}).get("test")}
          assert len(exes)==1,exes
          exe=exes.pop()
          result=subprocess.run(["strace","-f","-yy","-s","256","-e","trace=openat,readlink,readlinkat,newfstatat,statx,fstat,getdents64","-o","alias-descriptors.strace",exe,"--exact","snapshot::tests::public_catalog_observation_old_alias_names_use_current_logical_child_metadata_after_foreign_rebuild","--nocapture"],capture_output=True,text=True)
          pathlib.Path("alias-case.stdout").write_text(result.stdout)
          pathlib.Path("alias-case.stderr").write_text(result.stderr)
          assert result.returncode==101,(result.returncode,result.stdout,result.stderr)
          trace=pathlib.Path("alias-descriptors.strace")
          assert trace.stat().st_size<=8000000
          errors=[line for line in trace.read_text().splitlines() if "ENOTDIR" in line]
          assert errors,"No actual ENOTDIR syscall was observed"
          receipt={"source":"e8760d2d68a5a3e11025ca0536dfc952104c96ee","executable":exe,"returncode":result.returncode,"trace_bytes":trace.stat().st_size,"trace_sha256":hashlib.sha256(trace.read_bytes()).hexdigest(),"enotdir":errors}
          pathlib.Path("alias-descriptor-receipt.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps(receipt,indent=2))
          PYTRACE
      - name: Preserve synthetic descriptor evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public112-alias-descriptors
          path: |
            alias-descriptors.strace
            alias-case.stdout
            alias-case.stderr
            alias-descriptor-receipt.json
          if-no-files-found: error
