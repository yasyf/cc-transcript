name: Closed positive prefix component regression
on:
  push:
    branches: [diag/public112-closed-positive-candidate]
permissions:
  contents: read
jobs:
  positive-prefix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 3ff8bb5b9c3faffab9786b50f667e6f76aa1e9cd
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Preserve the zero-materialization closed positive
        run: cargo test -p cc-transcript-core --no-default-features --lib -- snapshot::ledger_tests::public_catalog_review_a_closed_positive_does_not_materialize_a_later_authority_view --exact --nocapture
      - name: Traverse the changed file-to-directory root
        run: cargo test -p cc-transcript-core --no-default-features --lib -- snapshot::ledger_tests::public_catalog_review_a_cached_root_positive_that_became_a_directory_is_traversed --exact --nocapture
