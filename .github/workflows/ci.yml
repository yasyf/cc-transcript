name: Catalog pending NAME baseline

on:
  pull_request:

permissions:
  contents: read

jobs:
  catalog-name-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Record actual Rust toolchain
        run: |
          rustc --version --verbose
          cargo --version
      - name: Reproduce retained NAME frontier reordering on unchanged production
        run: cargo test -p cc-transcript-core --no-default-features --lib -- registered_catalog_pending_name_survives_earlier_frontier_reordering --nocapture
