name: Catalog validation baseline

on: pull_request

jobs:
  catalog-validation-baseline:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Measure existing catalog ID comparisons
        run: cargo test -p cc-transcript-core --no-default-features --lib -- registered_catalog_id_validation_ --nocapture
