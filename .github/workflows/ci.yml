name: Public catalog union behavioral diagnostics
on:
  push:
    branches: [diag/public112-behavior-trace]
permissions:
  contents: read
jobs:
  behavioral-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 3cf15b0f001659ececf192331966ddc226a68d48
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Observe old-name alias metadata after a foreign rebuild
        id: alias
        continue-on-error: true
        run: cargo test -p cc-transcript-core --no-default-features --lib -- snapshot::tests::public_catalog_observation_old_alias_names_use_current_logical_child_metadata_after_foreign_rebuild --exact --nocapture
      - name: Observe the ordinary-error registered slice
        id: ordinary
        continue-on-error: true
        run: cargo test -p cc-transcript-core --no-default-features --lib -- snapshot::ledger_tests::public_catalog_review_ordinary_io_errors_pre_admit_the_whole_registered_slice --exact --nocapture
      - name: Observe closed-positive authority materialization
        id: authority
        continue-on-error: true
        run: cargo test -p cc-transcript-core --no-default-features --lib -- snapshot::ledger_tests::public_catalog_review_a_closed_positive_does_not_materialize_a_later_authority_view --exact --nocapture
      - name: Verify all three existing behavioral failures were observed
        env:
          ALIAS_OUTCOME: ${{ steps.alias.outcome }}
          ORDINARY_OUTCOME: ${{ steps.ordinary.outcome }}
          AUTHORITY_OUTCOME: ${{ steps.authority.outcome }}
        run: |
          test "$ALIAS_OUTCOME" = failure
          test "$ORDINARY_OUTCOME" = failure
          test "$AUTHORITY_OUTCOME" = failure
