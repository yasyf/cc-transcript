name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: uv.lock

      - name: Sync (dev + judge + llm)
        run: uv sync --extra dev --extra judge --extra llm

      - name: Check snapshot schemas
        run: uv run python scripts/snapshot_contract.py cc_transcript/snapshot_schema --check

      - name: Prefetch embedder (potion-retrieval-32M)
        run: uv run python -c "from model2vec import StaticModel; StaticModel.from_pretrained('minishlab/potion-retrieval-32M')"

      # The activity parity suite reads the gitignored bench corpus from disk;
      # generation is deterministic (seeded), so CI regenerates it per run.
      - name: Generate the bench corpus (.fixtures)
        run: uv run python scripts/gen_corpus.py

      - name: Measure bounded grep fixture work
        run: |
          uv run --no-sync python - <<'PYPROBE'
          import json
          import subprocess
          import sys
          from pathlib import Path

          command = [str(Path(sys.executable).parent / "cc-transcript"), "grep", "zzzz_no_such_pattern_xyzzy", "--root", ".fixtures/corpus", "--scan-json"]
          profiles = {
              "interactive": [],
              "completion_oracle": ["--max-read-bytes", "268435456", "--max-events", "262144", "--timeout-ms", "120000"],
          }
          for name, flags in profiles.items():
              result = subprocess.run([*command, *flags], capture_output=True, text=True, timeout=125)
              print(json.dumps({"profile": name, "exit_code": result.returncode, "stdout": result.stdout, "stderr": result.stderr}), flush=True)
              payload = json.loads(result.stdout)
              assert payload["counts"] == [0]
              if name == "interactive":
                  assert result.returncode == 3 and not payload["outcome"]["complete"]
              else:
                  assert result.returncode == 1 and payload["outcome"]["complete"]
          PYPROBE

      - name: Test native Python bridge
        env:
          PYO3_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: cargo test -p cc-transcript-py --lib

      - name: Generate native type stubs
        env:
          PYO3_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: cargo run -p cc-transcript-py --bin stub_gen

      - name: Upload native type stubs
        uses: actions/upload-artifact@v7
        with:
          name: cc-transcript-stubs-${{ github.sha }}
          path: cc_transcript/_native.pyi

      - name: Type check (ty)
        continue-on-error: true
        run: uv run ty check cc_transcript

      - name: Test (pytest)
        run: uv run pytest

      - name: Build + smoke-test wheel in a fresh venv
        run: |
          uv build
          rm -rf .wheel-smoke
          uv venv --seed .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python dist/*.whl
          .wheel-smoke/bin/python -c "import cc_transcript; assert cc_transcript.parse(b'').path is None"

      - name: Upload tested wheel
        uses: actions/upload-artifact@v7
        with:
          name: cc-transcript-linux-${{ github.sha }}
          path: dist/*.whl

  snapshot-wheel:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
      - name: Build exact-source macOS wheel
        run: uv build --wheel
      - name: Test public snapshot API against wheel
        run: |
          uv venv .snapshot-smoke
          uv pip install --python .snapshot-smoke/bin/python dist/*.whl pytest
          mkdir -p .snapshot-tests/tests
          touch .snapshot-tests/tests/__init__.py
          cp tests/test_snapshots.py tests/test_snapshot_metadata_prose.py .snapshot-tests/tests/
          cd .snapshot-tests
          ../.snapshot-smoke/bin/python -I -m pytest --confcutdir=. --import-mode=importlib tests/test_snapshots.py tests/test_snapshot_metadata_prose.py
      - name: Upload tested wheel
        uses: actions/upload-artifact@v7
        with:
          name: cc-transcript-macos-${{ github.sha }}
          path: dist/*.whl

  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt

      # cache-bin (default true) also keeps the swift-bridge-cli install warm.
      - uses: Swatinem/rust-cache@v2

      - name: Format check (rustfmt)
        run: cargo fmt --check

      - name: Build bridge crate
        run: cargo build --release -p cc_transcript_swift --target aarch64-apple-darwin

      - name: Test bridge crate
        run: cargo test -p cc_transcript_swift

      - name: Build core crate (python-free, the Swift-linkage stand-in)
        run: cargo build -p cc-transcript-core --no-default-features

      - name: Test Rust core
        run: cargo test -p cc-transcript-core --no-default-features

      - name: Test bounded large-root warming
        if: contains(github.event.pull_request.labels.*.name, 'large-root-benchmark')
        run: cargo test -p cc-transcript-core --no-default-features two_hundred_megabyte_root_completes_in_three_second_steps --lib -- --ignored --test-threads=1

      - name: Test Swift package against the committed xcframework
        run: swift test --package-path swift

      # The swift tests above exercise the COMMITTED binary, so they can't see
      # a package that was never regenerated after a Rust change. Regenerate
      # and require the text artifacts (both Package.swift manifests, generated
      # Swift, headers) to match the committed tree; only byte-diffs in the
      # static lib are expected (rustc version/paths) and exempt.
      - name: Freshness guard (regenerated swift/ must match the committed tree)
        run: |
          scripts/build-swift-package.sh
          drift="$(git status --porcelain -- swift Package.swift | grep -v 'libcc_transcript_swift\.a$' || true)"
          if [ -n "$drift" ]; then
            echo "$drift"
            git --no-pager diff -- swift Package.swift ':!swift/RustXcframework.xcframework/macos-arm64/libcc_transcript_swift.a'
            echo "::error::swift/ is stale — rerun scripts/build-swift-package.sh and commit the diff"
            exit 1
          fi

      # The guard above regenerated swift/ from the current Rust source, so its
      # xcframework is freshly built. Re-test against it: a semantic Rust change
      # that alters only the .a (exempt from the drift check) would otherwise
      # pass the guard with a stale committed binary.
      - name: Test Swift package against the regenerated xcframework
        run: swift test --package-path swift
