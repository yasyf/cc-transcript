name: Certificate authority negative baseline v2
on:
  push:
    branches: [diag/public112-cert-authority-baseline-v2]
permissions:
  contents: read
jobs:
  negative-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c8a8785fb4c079cdb54de76895ef414d0b097545
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unchanged production must fail the certificate-consumer regression
        run: cargo test -p cc-transcript-core --no-default-features --lib -- registered_catalog_certificate_is_authority_bound_inside_one_physical_owner --nocapture
