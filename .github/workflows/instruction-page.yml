name: Instruction projection source contract
on:
  push:
    branches: [perf/instruction-page]
jobs:
  instruction-page:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: '3.13'
      - name: Generate canonical request and response schemas
        run: uv run --no-project --with pydantic==2.13.4 python scripts/snapshot_contract.py cc_transcript/snapshot_schema
      - name: Test real instruction projection and metadata selector contracts
        run: |
          cargo test -p cc-transcript-core native_instruction_ -- --nocapture
          cargo test -p cc-transcript-core snapshot_projection::tests:: -- --nocapture
      - name: Install actual Python binding in disposable CI environment
        run: uv sync --extra dev
      - name: Test actual compact projection decoder
        run: uv run --no-sync pytest tests/test_snapshots.py -k instruction_projection -v
      - name: Check Rust formatting
        if: always()
        run: cargo fmt --all -- --check
      - name: Retain actual generated schemas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instruction-page-generated-schemas
          path: cc_transcript/snapshot_schema/*.schema.json
