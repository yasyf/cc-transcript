# Great Docs configuration — https://posit-dev.github.io/great-docs/
# Build: uv run great-docs build · Preview: uv run great-docs preview

module: cc_transcript
display_name: cc-transcript
# The reference renders through STATIC griffe over the generated cc_transcript/_native.pyi.
# Dynamic mode can't: the public-API union aliases (TranscriptEvent, ContentBlock,
# ToolCall, …) are types.UnionType with no __module__, so griffe's dynamic loader
# self-aliases them and the CyclicAliasError flips the whole reference to static. Left
# true because great-docs applies that fallback itself; see cc-notes 4e18bcca.
dynamic: true
repo: https://github.com/yasyf/cc-transcript
site_url: "https://yasyf.github.io/cc-transcript/"
pypi: true

# Skip the per-page Markdown (.md) companion generation. great-docs' post-render
# pipes every rendered HTML page through a separate `quarto pandoc -f html -t gfm`
# subprocess (~0.25s each); at ~390 pages that is ~97s. Dropping it loses only the
# per-page .md companions and the "copy as markdown" widget — llms.txt/llms-full.txt,
# sitemap, and robots are generated separately and are unaffected; every HTML page
# and symbol stays intact.
# (inline_methods was measured and REJECTED: collapsing the ~98 method pages
# concentrates rendering into much heavier class pages — a ~220s net regression.)
markdown_pages: false

# Mascot-derived palette: solid navbar, per-mode accent. Gradient presets and
# hero starfield stay off (busy; the starfield intercepts homepage clicks).
navbar_color: "#191333"
accent_color:
  light: "#337a36"
  dark: "#7fce6a"

social_cards:
  enabled: true
  image: docs/assets/social-preview.jpg
  twitter_site: "@yasyf"

hero:
  name: cc-transcript
  tagline: "Grep every Claude Code session you've ever run."

# Narrative doc sections live alongside the curated API reference: Getting Started
# is a single landing page (docs/getting-started/index.qmd); Guides is a numbered
# set under docs/guide. Both render executable Quarto cells at build time.
sections:
  - title: Getting Started
    dir: docs/getting-started
    index: true
  - title: Guides
    dir: docs/guide
    navbar_after: Getting Started
    index: true

authors:
  - name: Yasyf Mohamedali
    role: Maintainer
    github: yasyf
    email: yasyfm@gmail.com

