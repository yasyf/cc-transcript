[project]
name = "cc-transcript"
version = "0.5.0"
description = "Typed events for Claude Code transcripts: discovery, a superset JSONL parser (Python + Rust), and ingestion-state tracking."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "Yasyf Mohamedali", email = "yasyfm@gmail.com" }]
keywords = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.20",
    "anyio>=4.4",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ty>=0.0.44",
    "ruff>=0.8",
]
sentiment = [
    "spacy>=3.8",
    "afinn>=0.1",
]
# Back-compat alias for the pre-0.6 extra name; prefer [sentiment].
lexicon = ["cc-transcript[sentiment]"]

[project.urls]
Homepage = "https://github.com/yasyf/cc-transcript"
Documentation = "https://yasyf.github.io/cc-transcript/"
Repository = "https://github.com/yasyf/cc-transcript"
Issues = "https://github.com/yasyf/cc-transcript/issues"
Changelog = "https://github.com/yasyf/cc-transcript/blob/main/CHANGELOG.md"

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.maturin]
module-name = "cc_transcript._parser_rs"
manifest-path = "rust/Cargo.toml"
python-source = "."
features = ["extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--tb=short", "-q"]
markers = [
    "unit: Pure unit tests",
    "integration: Integration tests",
]

# ty (Astral) is the default type checker — run `uv run ty check cc_transcript`.
# It is fast, understands modern syntax, and avoids the strict-pyright false
# positives on pydantic/attrs-style dynamic defaults and PK-type overrides.
[tool.ty.rules]
# Keep cross-checker `# type: ignore` / `# pyright: ignore` comments from tripping ty.
unused-type-ignore-comment = "ignore"
unresolved-import = "ignore"

# pyright is kept as a secondary checker (editors / `uvx pyright`). Basic mode plus
# a few disables covers the noise; ty is the gate that runs in CI.
[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
include = ["cc_transcript"]
venvPath = "."
venv = ".venv"
reportImplicitOverride = "none"
reportIncompatibleVariableOverride = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportMissingTypeArgument = "none"
reportPrivateImportUsage = "none"
reportUnusedCallResult = "none"

[tool.ruff]
line-length = 120
target-version = "py313"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[dependency-groups]
docs = [
    # great-docs imports griffe's 2.x module layout; griffelib is the modern
    # griffe (2.x) distribution, overriding the legacy griffe<2 pin great-docs
    # itself still declares.
    "griffelib>=2.0",
    # Tracking great-docs main until a release newer than 0.13.0: main carries
    # build-time GitHub widget stats (embedded via the CI GITHUB_TOKEN), which
    # drop the navbar widget's client-side API calls — the source of GitHub 403
    # errors on the published site.
    # TODO(bootstrap): revert to a PyPI pin (`great-docs>=0.14`) once released.
    "great-docs @ git+https://github.com/posit-dev/great-docs@main",
]
